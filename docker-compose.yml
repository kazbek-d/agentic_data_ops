version: '3.8'

services:
  # --- LAYER 1: BRAIN AND INTERFACE (FastAPI + LangGraph + DAG Engine) ---
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: dataops_orchestrator
    ports:
      - "8000:8000" # Expose FastAPI port for our HITL web interface
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY} # Pass the API key from local .env
      - MCP_WORKER_URL=http://mcp_worker:5011 # MCP worker address in internal Docker network
      - QDRANT_HOST=qdrant
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dataops_checkpoints}
      - POSTGRES_USER=${POSTGRES_USER:-caedatallc_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-SecretPassword2026}
    volumes:
      - ./shared_store:/app/store # Shared folder for business rules
    networks:
      - dataops_network
    depends_on:
      - mcp_worker
      - postgres
      - qdrant
    restart: always

  # --- LAYER 2: COMPUTATIONAL ARMS (MCP + Script Runtime) ---
  mcp_worker:
    build:
      context: ./mcp_worker
      dockerfile: Dockerfile
    container_name: dataops_mcp_worker
    ports:
      - "5011:5011" # Internal API for communicating with the orchestrator
    volumes:
      - ./shared_store:/app/store # Worker reads business rules and stores buffer
    networks:
      - dataops_network
    restart: always

  # --- LAYER 3: VECTOR KNOWLEDGE BASE (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: dataops_qdrant
    ports:
      - "6333:6333" # REST API for working with vectors
      - "6334:6334" # gRPC port for search
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dataops_network
    restart: always

  # --- LAYER 4: PERSISTENT MEMORY AND DAG STATE TREE (PostgreSQL) ---
  postgres:
    image: postgres:16-alpine
    container_name: dataops_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataops_checkpoints}
      POSTGRES_USER: ${POSTGRES_USER:-caedatallc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dataops_network

  # --- LAYER 5: WEB ADMIN FOR BRANCH INSPECTION (Adminer) ---
  adminer:
    image: adminer:latest
    container_name: dataops_pg_adminer
    restart: always
    ports:
      - "8080:8080" # Open Adminer web interface
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - dataops_network

volumes:
  shared_store:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local

networks:
  dataops_network:
    driver: bridge